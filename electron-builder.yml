appId: com.neurocoop.calendario
productName: Calendario NEUROCOOP
copyright: NEUROCOOP

# El servidor Express corre en un proceso Node separado (vendor/node-runtime),
# no dentro de Electron, por lo que better-sqlite3 nunca se carga con la ABI
# de Electron. No hay que recompilarlo contra Electron (y de hecho no se debe).
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - electron-admin-ui/**/*
  - shared/**/*
  - build/icon.ico
  - package.json
  - "!**/*.map"
extraResources:
  - from: dist-app/app-server
    to: app-server
  - from: vendor/node-runtime
    to: runtime

win:
  target: nsis
  icon: build/icon.ico
  # Sin certificado de firma de codigo; esto tambien evita que electron-builder
  # intente descargar herramientas de firma de macOS (winCodeSign), que fallan
  # al extraerse en cuentas de Windows sin privilegio de enlaces simbolicos.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: CalendarioNeurocoop-Setup-${version}.exe
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
